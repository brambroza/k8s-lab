apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-ingress
  namespace: lab
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              role: tester
      ports:
        - protocol: TCP
          port: 9898
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: lab-gateway
              gateway.envoyproxy.io/owning-gateway-namespace: lab
      ports:
        - protocol: TCP
          port: 9898
