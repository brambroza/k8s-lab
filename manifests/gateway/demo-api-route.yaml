apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
  namespace: lab
spec:
  parentRefs:
    - name: lab-gateway
      sectionName: http
  hostnames:
    - api.lab.test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: demo-api
          port: 80
